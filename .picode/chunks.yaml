# run-2026-08-15T03-00-00-SUBAGENT 分块方案（sys-arch 定稿 · 覆盖 run-lead 草案）
# 基线：main = 911ea0c（562/562 绿）。scale=M，并行 ≤3 组，3 波次（wave 字段显式化）。
# 范围：continuable 子代理实现（蓝图 D107 I1-I6）：durable 会话 + resume、spawn 深度围栏、
#       写集只收窄 + 所有权围栏、settled 通知 + 投喂分级。
# 非目标：事件溯源恢复（守 D002/D082）；jobs 注册表（余量不足排下轮）；I7 cancel 队列。
# 与草案差异（详见 reviews/sysarch-chunks.md）：I2+I3 合并为 chunk-durable-session（session-store.ts
#   冲突）；spec-17 单写者=durable-session（owner 声明）；evolve.ts/rules-engine.ts 移出写集；
#   I3 落点从 self-drive.ts 迁至 wakeAgent（pi-adapter.ts，D057 统一 spawn 入口）。

shared_files:
  - path: "docs/spec/17-agent-runtime.md"
    owner_chunk: chunk-durable-session
    note: "蓝图 §3 修订点清单由 owner 一次性落地（§4 delegation_depth/parent_session、§5.2 sleep
           保留平台会话引用、§6 子代理 persona 收窄一句、§9 owner_session 围栏 + 来源标注纪律）；
           fence-owner / settle-feed / docs 只读引用"
  - path: "packages/core/src/errors.ts"
    owner_chunk: chunk-durable-session
    note: "本轮唯一新增错误码 SUBAGENT_DEPTH_EXCEEDED（I3，errors.test.ts 同步）；I5 复用既有
           ROOM_POST_DENIED（消息标记 owner 围栏），fence-owner 不得修改 errors.ts"

chunks:
