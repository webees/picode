      - "process-quickwin-r17.md：增量进度报告格式（时间戳+phase 变更+WIP 产物路径+阻塞，追加式）、接管前置三查核验与变更单式留痕、at_risk 阶梯动作（1 通知/2 红灯/3 接管）、评分回路收尾 checklist（scores 齐 + talent 聚合）——作为下轮 skill 手册同步的权威依据"
      - "operations.md：工具链脚本用法（worktree-setup/test-iso/env/merge-gate/tour-check）+ watchdog 运维说明（at_risk/takeover_candidate 语义与处置）+ 环境自检说明"
