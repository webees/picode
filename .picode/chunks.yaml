      - "docs/reference/decision-catalog.md"
      - "docs/guides/operations.md"
      - "docs/knowledge/feedback/process-quickwin-r17.md"
      - "docs/knowledge/evolve/run-2026-08-16T09-30-00-EFFICIENCY.md"
    read_paths:
