      - "I2 sleep：sleepAgent 对 oc- 会话不再 DELETE（mock serve 断言零 DELETE 调用）；session-store.sleep 不清 pi_session_id（oc-<id> 保留为平台持久会话引用，文件真相指针）"
      - "I2 wake：resume 优先——同会话 sendReady 续写（mock serve 断言 POST /session/{id}/message 且无新 POST /session）；会话失联/404 → 回退重 spawn + 转录摘要（沿用 wakeWithOpencode 现状）"
      - "I2 terminate：terminateAgent 保持终态销毁（DELETE 语义不变）；既有测试语义不变"
      - "I3 注册：SessionRecord 增可选 delegation_depth/parent_session（旧 session.yaml 兼容，缺省=0/平台席，schema_version 保持 \"1\"，比照 budget? 先例）；SessionStore.register 支持 depth/parent 参数"
      - "I3 围栏：wakeAgent（统一 spawn 入口，D057）对 delegation_depth > 3 结构化拒绝（SUBAGENT_DEPTH_EXCEEDED，消息含当前深度与上限）"
      - "spec-17（§4/§5.2/§6/§9）+ reference/schemas/session.yaml 按蓝图 §3 建议条文落地（本 chunk 为 owner）"
      - "全量 npm test 绿 + npm run check 三 lint 0 error"
