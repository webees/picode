    write_paths:
      - "packages/orchestrator/src/opencode-adapter.ts"
      - "packages/orchestrator/src/opencode-adapter.test.ts"
      - "packages/orchestrator/src/pi-adapter.ts"
      - "packages/orchestrator/src/pi-adapter.test.ts"
      - "packages/orchestrator/src/session-store.ts"
      - "packages/orchestrator/src/session-store.test.ts"
      - "packages/core/src/session.ts"
      - "packages/core/src/session.test.ts"
      - "packages/core/src/errors.ts"
      - "packages/core/src/errors.test.ts"
      - "docs/spec/17-agent-runtime.md"
      - "docs/reference/schemas/session.yaml"
